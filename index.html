<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <nav>
        <div class="left">KANBAN</div>
        <div class="right">
          <button id="toggle-modal">Add New Task</button>
        </div>
      </nav>

      <section class="board">
        <div class="task-column" id="todo">
          <div class="heading">
            <div class="left">TODO</div>
            <div class="right">Count: <span class="task-count">0</span></div>
          </div>
        </div>

        <div class="task-column" id="progress">
          <div class="heading">
            <div class="left">In Progress</div>
            <div class="right">Count: <span class="task-count">0</span></div>
          </div>
        </div>

        <div class="task-column" id="done">
          <div class="heading">
            <div class="left">Done</div>
            <div class="right">Count: <span class="task-count">0</span></div>
          </div>
        </div>
      </section>
    </main>

    <div class="modal">
      <div class="bg" aria-hidden="true"></div>
      <form id="task-form" class="center">
        <input type="text" placeholder="Task title" id="task-title" required />
        <input type="text" placeholder="Enter description" id="task-description" />
        <button type="submit">Add Task</button>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
