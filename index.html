<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <nav>
        <div class="left">KANBAN</div>
        <div class="right">
          <button id="toggle-modal">Add New Task</button>
        </div>
      </nav>

      <section class="board">
        <div class="task-column" id="todo">
          <div class="heading">
            <div class="left">TODO</div>
            <div class="right">COUNT</div>
          </div>

          <div draggable="true" class="task">
            <div class="task-title">
              <h2>Task1</h2>
              <p>Description</p>
              <button>Delete</button>
            </div>
          </div>
        </div>

        <div class="task-column" id="progress">
          <div class="heading">
            <div class="left">In Progress</div>
            <div class="right">Count</div>
          </div>
        </div>

        <div class="task-column" id="done">
          <div class="heading">
            <div class="left">Done</div>
            <div class="right">Count</div>
          </div>
        </div>
      </section>
    </main>

    <div class="modal active add-task-btn">
      <div class="bg"></div>
      <div class="center">
        <input type="text" placeholder="task title" />
        <input type="text" placeholder="Enter description" />
        <button id="add-new-task" class="add-task-btn">Btn</button>
      </div>

    </div>

    <script src="script.js"></script>
  </body>
</html>
